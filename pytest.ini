[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: isolated Python business-rule tests
    api: HTTP contract tests using Flask's in-process client
    e2e: real Chromium browser tests against a local HTTP server
    smoke: essential application checks
    sanity: focused authorization change verification
    regression: all implemented deterministic regression behavior
    ai: AI adapter contract tests using mocked local responses
