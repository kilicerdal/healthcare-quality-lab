version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Recorded environments are historical evidence, not install manifests.
    exclude-paths:
      - "/artifacts/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
