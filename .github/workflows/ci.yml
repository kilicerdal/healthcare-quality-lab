name: V8.2 quality and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_browsers:
        description: Run every browser test in Chromium, Firefox and WebKit
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Fast unit and API gate
        run: python -m pytest tests/unit tests/api -q --junitxml artifacts/v7.0/fast-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7.0-fast-evidence
          path: artifacts/v7.0/fast-results.xml
  verify:
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure Ubuntu package downloads
        run: |
          # Avoid the regional mirror that stalled browser dependencies in V7.0 CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/zzzz-hql-downloads
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: python -m playwright install --with-deps chromium
      - name: Full regression and known faults
        run: python -m tools.verify
      - name: Broader mutation and resilience evidence
        run: |
          python -m tools.mutations > artifacts/v7.0/ci-mutations.json
          python -m tools.resilience --output artifacts/v7.0/ci-resilience.json
          python -m tools.integrations --output artifacts/v7.0/ci-integrations.json
          python -m tools.effectiveness --output artifacts/v7.0/ci-effectiveness.json
          python -m tools.portfolio_rehearsal --output artifacts/v7.0/ci-portfolio-rehearsal.json
      - name: Build, inspect and rehearse release
        run: |
          python -m tools.release build --output releases/ci
          python -m tools.release inspect releases/ci/v8.2.0-source.zip
          python -m tools.rehearse releases/ci/v8.2.0-source.zip --output artifacts/v7.0/ci-runtime-rehearsal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthcare-quality-lab-v7.0-evidence
          path: |
            releases/ci/v8.2.0-source.zip
            releases/ci/v8.2.0-manifest.json
            artifacts/
  browsers:
    if: github.event_name != 'pull_request'
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure Ubuntu package downloads
        run: |
          # Avoid the regional mirror that stalled browser dependencies in V7.0 CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/zzzz-hql-downloads
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-browser core and advanced journeys
        run: python -m pytest tests/e2e/test_browser.py tests/e2e/test_workflow_browser.py tests/e2e/test_research_browser.py tests/e2e/test_advanced_browser.py tests/e2e/test_design_browser.py tests/e2e/test_investigation_browser.py tests/e2e/test_traceability_browser.py tests/e2e/test_effectiveness_browser.py tests/e2e/test_experiments_browser.py tests/e2e/test_portfolio_browser.py tests/e2e/test_v8_workbench_browser.py tests/e2e/test_expectations_browser.py tests/e2e/test_compact_browser.py --browser ${{ matrix.browser }} -q --junitxml artifacts/v7.0/${{ matrix.browser }}-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7.0-${{ matrix.browser }}-evidence
          path: |
            artifacts/v7.0/
            test-results/
  scheduled_browsers:
    if: github.event_name == 'schedule' || inputs.full_browsers
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure Ubuntu package downloads
        run: |
          # Avoid the regional mirror that stalled browser dependencies in V7.0 CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/zzzz-hql-downloads
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m pytest tests/e2e --browser chromium --browser firefox --browser webkit -q --junitxml artifacts/v7.0/scheduled-browser-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7.0-scheduled-browser-evidence
          path: artifacts/v7.0/
