name: V5.8 quality and release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Verify tests and known fault detection
        run: python -m tools.verify
      - name: Build and inspect a checksummed source release
        run: |
          python -m tools.release build --output releases/ci
          python -m tools.release inspect releases/ci/v5.8.0-source.zip
      - name: Rehearse the staged release through actual HTTP
        run: python -m tools.rehearse releases/ci/v5.8.0-source.zip --output artifacts/v5.8/ci-runtime-rehearsal.json
      - name: Save checksummed release and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-quality-lab-v5.8-evidence
          path: |
            releases/ci/v5.8.0-source.zip
            releases/ci/v5.8.0-manifest.json
            artifacts/
            test-results/
          retention-days: 14
